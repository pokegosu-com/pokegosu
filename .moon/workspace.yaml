# A directory is a project only if it holds a moon.yaml, so these globs never
# sweep in the Go or Swift apps that will sit alongside.
projects:
  globs:
    - 'apps/*'
    - 'libs/*/*'
  sources:
    root: '.'
    supabase: 'supabase'

vcs:
  defaultBranch: 'main'
  provider: 'github'

hasher:
  # moon excludes node_modules on its own, but nothing else — not even paths
  # listed in .gitignore.
  ignorePatterns:
    - '**/.moon/cache/**'
