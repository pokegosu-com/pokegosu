# The single source of truth for language versions; moon installs them, so no
# runtime is set up by hand. Swift arrives with its app.
javascript:
  packageManager: 'pnpm'

node:
  version: '26.8.2'

pnpm:
  version: '12.4.1'

# One module for the whole repository, at the root: every Go project is a
# package in it, so a single version tag covers them all.
go:
  version: '1.24.0'
