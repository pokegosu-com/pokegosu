# How every implementation must read Claude Code's logs into hourly token
# totals: one harness, one set of cases, a driver per language. See README.md.
id: 'coder-scan-claude-code'
layer: 'automation'
toolchains:
  default: 'node'

workspace:
  inheritedTasks:
    include: []

tasks:
  build-driver-go:
    description: 'Build the Go driver around libs/go/coder'
    command: 'go build -o dist/driver-go ./drivers/go'
    toolchains: ['go']
    inputs:
      - 'drivers/go/**/*.go'
      - '/libs/go/coder/**/*.go'
      - '/go.mod'
    outputs:
      - 'dist/driver-go'

  conformance-go:
    description: 'Run the scan cases against the Go driver'
    command: 'bats scan.bats'
    env:
      CODER_SCAN_DRIVER: '$projectRoot/dist/driver-go'
    deps:
      - '~:build-driver-go'
    inputs:
      - 'scan.bats'
      - 'helpers/**/*'
      - 'cases/**/*'
