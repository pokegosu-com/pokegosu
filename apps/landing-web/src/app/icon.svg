<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.8 -12.1 45.4 45.4">
  <!-- A Poké Ball in a trainer's cap: PokeGosu as a whole, so every app carries the same one. It sits in accent on a white tile, so it reads on light and dark tab bars alike. -->
  <defs>
    <g id="cap">
      <ellipse cx="13.2" cy="6.2" rx="1.7" ry="2"/>
      <path d="M1.5 23.5C1 14.5 6 7.6 13.5 7.6C20.5 7.6 24.6 12.4 25 19.4Z"/>
      <path d="M19.5 20.2C24 18.6 28.6 19 31.4 21C31 23.4 27.4 24.6 22.6 24.4C19 24.2 16 23 12.5 21.6Z"/>
    </g>
    <!-- Clears the ball around the cap, so the cap sits on it rather than merging. -->
    <mask id="under-cap" maskUnits="userSpaceOnUse" x="-20" y="-20" width="72" height="72">
      <rect x="-20" y="-20" width="72" height="72" fill="#fff"/>
      <use href="#cap" transform="translate(14.5 10.17) rotate(-10) scale(1.2 1.02) translate(-13 -21.5)" stroke="#000" stroke-width="2.04" stroke-linejoin="round"/>
    </mask>
    <!-- The gap between crown and bill, in the cap's own space. -->
    <mask id="bill-gap" maskUnits="userSpaceOnUse" x="-20" y="-20" width="72" height="72">
      <rect x="-20" y="-20" width="72" height="72" fill="#fff"/>
      <path d="M19.2 19.6C24 18 28.6 18.4 31.6 20.4" fill="none" stroke="#000" stroke-width="1.2"/>
    </mask>
  </defs>
  <rect x="-4.8" y="-12.1" width="45.4" height="45.4" rx="10" fill="#fff"/>
  <g fill="none" stroke="#3266e4" stroke-width="2.6" mask="url(#under-cap)">
    <circle cx="16" cy="16" r="10.6"/>
    <path d="M5.4 16H12.6M19.4 16H26.6"/>
    <circle cx="16" cy="16" r="3.2"/>
  </g>
  <use href="#cap" transform="translate(14.5 10.17) rotate(-10) scale(1.2 1.02) translate(-13 -21.5)" fill="#3266e4" mask="url(#bill-gap)"/>
</svg>
