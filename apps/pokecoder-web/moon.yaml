id: 'pokecoder-web'
layer: 'application'
language: 'typescript'
stack: 'frontend'
toolchains:
  default: 'node'
tags:
  - 'nextjs'
dependsOn:
  - 'ts-config'
  - 'ts-supabase'
  - 'ts-ui'

env:
  PORT: '3002'

tasks:
  # vinext dev is Vite underneath and ignores PORT, so it is passed.
  dev:
    args: ['--port', '3002']
