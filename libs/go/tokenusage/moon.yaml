# Reading coding agents' logs into hourly token totals: the parsers, the
# deduplication rules, and the scan that ties them together. Every client in
# Go uses it; clients in other languages implement the same rules, and
# tests/tokenusage checks that they agree.
id: 'go-tokenusage'
layer: 'library'
language: 'go'
toolchains:
  default: 'go'

tasks:
  vet:
    command: 'go vet ./...'
    inputs:
      - '**/*.go'
      - '/go.mod'

  test:
    command: 'go test ./...'
    inputs:
      - '**/*.go'
      - '/go.mod'
