# What a coder client needs: reading coding agents' logs into hourly token
# totals — the parsers, the deduplication rules, the scan that ties them
# together — and handing those totals to the server.
#
# Clients in other languages implement the same rules, and tests/coder checks
# that they agree.
id: 'go-coder'
layer: 'library'
language: 'go'
toolchains:
  default: 'go'

tasks:
  vet:
    command: 'go vet ./...'
    inputs:
      - '**/*.go'
      - '/libs/go/internal/**/*.go'
      - '/go.mod'

  test:
    command: 'go test ./...'
    inputs:
      - '**/*.go'
      - '/libs/go/internal/**/*.go'
      - '/go.mod'
