# The Supabase project: schema, auth and storage configuration, and later
# edge functions. Language-neutral — every client talks to what it owns.
id: 'supabase'
layer: 'application'
stack: 'backend'
toolchains:
  default: 'node'

# Every task here is an imperative command, not a build step. `utility` keeps
# them out of `moon check` and `moon ci`, so nothing automated can stop the
# local stack or reach a remote project.
tasks:
  start:
    description: 'Start the local Supabase stack (requires Docker)'
    command: 'supabase start'
    preset: 'utility'

  stop:
    description: 'Stop the local Supabase stack'
    command: 'supabase stop'
    preset: 'utility'

  status:
    description: 'Print local URLs and keys'
    command: 'supabase status'
    preset: 'utility'

  reset:
    description: 'Drop the local database and replay every migration'
    command: 'supabase db reset'
    preset: 'utility'

  diff:
    description: 'Capture local schema changes as a migration file'
    command: 'supabase db diff'
    preset: 'utility'

  # Deploys replay every migration against an empty database; a local one got
  # its state incrementally and can diverge. This walks the deploy path.
  #
  # CI only: it ends in `db reset`, which would wipe a developer's local data.
  # `moon ci` still skips it unless a migration changed, so a PR that touches
  # nothing here pulls no images. Starting only the four services the schema
  # needs costs 2GB instead of 8.5GB.
  verify:
    description: 'Apply every migration to a clean database (CI only)'
    script: >-
      supabase start -x studio,edge-runtime,logflare,vector,imgproxy,realtime,storage-api,postgres-meta,mailpit,supavisor
      && supabase db reset
    inputs:
      - 'migrations/**/*.sql'
      - 'config.toml'
    options:
      runInCI: 'only'
