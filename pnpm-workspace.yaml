# Only directories holding a package.json count, so Go and Swift apps can sit
# in apps/ untouched.
packages:
  - 'apps/*'
  - 'libs/ts/*'
  - 'supabase'

# pnpm blocks postinstall scripts unless listed. unrs-resolver ships a native
# binary but falls back to JavaScript, and create-next-app declines it too.
allowBuilds:
  unrs-resolver: false
