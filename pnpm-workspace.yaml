# Only directories holding a package.json count, so Go and Swift apps can sit
# in apps/ untouched.
packages:
  - 'apps/*'
  - 'libs/ts/*'
  - 'supabase'
  - 'tests/*'

# pnpm blocks postinstall scripts unless listed. unrs-resolver ships a native
# binary but falls back to JavaScript, and create-next-app declines it too.
# esbuild and workerd have no fallback: Vite bundles with the first, and
# `wrangler dev` runs the Workers runtime out of the second.
allowBuilds:
  esbuild: true
  unrs-resolver: false
  workerd: true
