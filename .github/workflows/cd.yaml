name: 'CD'

# Pushing a version tag ships every app and the Edge Functions at that version,
# and the GitHub release, with the CLI's binaries on it, is published only once
# they are all live. The `production` environment only
# admits `v*` tags, so nothing else can reach its secrets.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# One deploy at a time, and never cut one short halfway through.
concurrency:
  group: 'cd'
  cancel-in-progress: false

# Every job reads the code; only the release job writes, and says so itself.
permissions:
  contents: 'read'

jobs:
  # Every moon project tagged `nextjs` is a Worker, so a new app joins the
  # release by existing rather than by being listed here.
  plan:
    name: 'Plan'
    runs-on: 'ubuntu-latest'
    outputs:
      apps: '${{ steps.apps.outputs.apps }}'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'moonrepo/setup-toolchain@v0'
      - id: 'apps'
        run: |
          apps=$(moon query projects 'tag=nextjs' | jq -c '[.projects[] | {id, source}]')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  # Applies the migrations the production database has not recorded yet, before
  # any app ships against them; CI's `supabase:verify` has already replayed
  # them onto an empty database.
  #
  # No database password is kept anywhere: given only a project and a token,
  # the Supabase CLI asks the Management API for a login role with a
  # temporary password, and connects through the pooler with it. The token,
  # SUPABASE_ACCESS_TOKEN, is shared with the functions job.
  #
  # It is a personal access token, which reaches every project its account
  # does; scoped tokens, which would limit it to this project, are not open to
  # every account yet. So it lives for one release only: just before tagging,
  # make one in the Supabase dashboard (Account, Access Tokens) that expires a
  # day later, and set it on the environment with
  # `gh secret set SUPABASE_ACCESS_TOKEN --env production`. Supabase allows
  # thirty days at most anyway. Forgotten or expired, this job is the first to
  # fail, so nothing ships half way; set a fresh token and rerun the failed
  # jobs.
  migrate:
    name: 'Migrate database'
    runs-on: 'ubuntu-latest'
    environment: 'production'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'moonrepo/setup-toolchain@v0'
      # moon installs the Node and pnpm from .moon/toolchains.yaml but keeps
      # them off PATH; `moon bin` says where they are.
      - run: |
          moon setup
          dirname "$(moon bin node)" >> "$GITHUB_PATH"
          dirname "$(moon bin pnpm)" >> "$GITHUB_PATH"
      - run: 'pnpm install --frozen-lockfile'
      - run: 'pnpm exec supabase db push --project-ref "$SUPABASE_PROJECT_REF" --yes'
        env:
          SUPABASE_ACCESS_TOKEN: '${{ secrets.SUPABASE_ACCESS_TOKEN }}'
          SUPABASE_PROJECT_REF: '${{ vars.SUPABASE_PROJECT_REF }}'

  # One runner per app, so eight apps take as long as the slowest one. Each
  # deploy builds afresh inside vinext-cloudflare, which validates the app's
  # NEXT_PUBLIC_* schema with production values; there is no .env.local here,
  # and SKIP_ENV_VALIDATION stays unset. A failing app stops before its upload
  # without holding the others back, and is retried by rerunning its job.
  deploy:
    name: 'Deploy ${{ matrix.app.id }}'
    needs: ['plan', 'migrate']
    runs-on: 'ubuntu-latest'
    environment: 'production'
    strategy:
      fail-fast: false
      matrix:
        app: '${{ fromJSON(needs.plan.outputs.apps) }}'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'moonrepo/setup-toolchain@v0'
      # moon installs the Node and pnpm from .moon/toolchains.yaml but keeps
      # them off PATH; `moon bin` says where they are.
      - run: |
          moon setup
          dirname "$(moon bin node)" >> "$GITHUB_PATH"
          dirname "$(moon bin pnpm)" >> "$GITHUB_PATH"
      - run: 'pnpm install --frozen-lockfile'
      # Every app gets every variable; each schema reads only its own.
      - run: 'pnpm --dir ${{ matrix.app.source }} run deploy:vinext'
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          NEXT_PUBLIC_ACCOUNT_URL: '${{ vars.NEXT_PUBLIC_ACCOUNT_URL }}'
          NEXT_PUBLIC_SUPABASE_URL: '${{ vars.NEXT_PUBLIC_SUPABASE_URL }}'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: '${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}'
          NEXT_PUBLIC_COOKIE_DOMAIN: '${{ vars.NEXT_PUBLIC_COOKIE_DOMAIN }}'
          NEXT_PUBLIC_POKEDEX_URL: '${{ vars.NEXT_PUBLIC_POKEDEX_URL }}'
          NEXT_PUBLIC_CODER_URL: '${{ vars.NEXT_PUBLIC_CODER_URL }}'

  # Deploys every function under supabase/functions, after the migrations it
  # calls into, with the verify_jwt settings in supabase/config.toml, on the
  # token the migrate job describes. `--use-api` bundles on Supabase's side,
  # so no Docker.
  functions:
    name: 'Deploy Edge Functions'
    needs: 'migrate'
    runs-on: 'ubuntu-latest'
    environment: 'production'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'moonrepo/setup-toolchain@v0'
      # moon installs the Node and pnpm from .moon/toolchains.yaml but keeps
      # them off PATH; `moon bin` says where they are.
      - run: |
          moon setup
          dirname "$(moon bin node)" >> "$GITHUB_PATH"
          dirname "$(moon bin pnpm)" >> "$GITHUB_PATH"
      - run: 'pnpm install --frozen-lockfile'
      - run: 'pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api'
        env:
          SUPABASE_ACCESS_TOKEN: '${{ secrets.SUPABASE_ACCESS_TOKEN }}'
          SUPABASE_PROJECT_REF: '${{ vars.SUPABASE_PROJECT_REF }}'

  # The CLI for every platform install-cli.sh knows, under names without the
  # version, so `releases/latest/download/<name>` always finds the newest.
  # Building needs no secrets, so it runs outside the production environment.
  cli:
    name: 'Build CLI'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'moonrepo/setup-toolchain@v0'
      - run: |
          moon setup
          dirname "$(moon bin go)" >> "$GITHUB_PATH"
      - run: |
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="pokegosu_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "build/$name/pokegosu" ./apps/cli/cmd/pokegosu
            # Apache 2.0 asks for its licence and notice to go with the binary.
            cp LICENSE NOTICE "build/$name/"
            tar -czf "release/$name.tar.gz" -C "build/$name" pokegosu LICENSE NOTICE
          done
          cd release && sha256sum *.tar.gz > checksums.txt
      - uses: 'actions/upload-artifact@v7'
        with:
          name: 'cli'
          path: 'release/'

  # A release exists only for a version that is live.
  release:
    name: 'Release'
    needs: ['deploy', 'functions', 'cli']
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
    steps:
      - uses: 'actions/download-artifact@v8'
        with:
          name: 'cli'
          path: 'release/'
      - run: 'gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes release/*'
        env:
          GH_TOKEN: '${{ github.token }}'
