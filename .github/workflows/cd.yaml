name: 'CD'

# Pushing a version tag ships every app at that version, and the GitHub release
# is published only once they are all live. The `production` environment only
# admits `v*` tags, so nothing else can reach its secrets.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# One deploy at a time, and never cut one short halfway through.
concurrency:
  group: 'cd'
  cancel-in-progress: false

jobs:
  # Every moon project tagged `nextjs` is a Worker, so a new app joins the
  # release by existing rather than by being listed here.
  plan:
    name: 'Plan'
    runs-on: 'ubuntu-latest'
    outputs:
      apps: '${{ steps.apps.outputs.apps }}'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'moonrepo/setup-toolchain@v0'
      - id: 'apps'
        run: |
          apps=$(moon query projects 'tag=nextjs' | jq -c '[.projects[] | {id, source}]')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  # One runner per app, so eight apps take as long as the slowest one. Each
  # build validates the app's NEXT_PUBLIC_* schema with production values;
  # there is no .env.local here, and SKIP_ENV_VALIDATION stays unset. Nothing
  # deploys until every app has built.
  build:
    name: 'Build ${{ matrix.app.id }}'
    needs: 'plan'
    runs-on: 'ubuntu-latest'
    environment: 'production'
    strategy:
      matrix:
        app: '${{ fromJSON(needs.plan.outputs.apps) }}'
    steps:
      - uses: 'actions/checkout@v7'
        with:
          # moon reads git history when it runs tasks; a shallow clone fails.
          fetch-depth: 0
          filter: 'blob:none'
      - uses: 'moonrepo/setup-toolchain@v0'
      # Every app gets every variable; each schema reads only its own.
      - run: 'moon run ${{ matrix.app.id }}:build'
        env:
          NEXT_PUBLIC_ACCOUNT_URL: '${{ vars.NEXT_PUBLIC_ACCOUNT_URL }}'
          NEXT_PUBLIC_SUPABASE_URL: '${{ vars.NEXT_PUBLIC_SUPABASE_URL }}'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: '${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}'
          NEXT_PUBLIC_COOKIE_DOMAIN: '${{ vars.NEXT_PUBLIC_COOKIE_DOMAIN }}'

  # Migrations must replay onto an empty database before a release can ship.
  verify-supabase:
    name: 'Verify migrations'
    needs: 'plan'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
        with:
          # moon reads git history when it runs tasks; a shallow clone fails.
          fetch-depth: 0
          filter: 'blob:none'
      - uses: 'moonrepo/setup-toolchain@v0'
      - run: 'moon run supabase:verify'

  # Starts only once every build and the migration check have passed, so what
  # remains to fail is an upload. Workers cannot be swapped together anyway, so
  # each app deploys on its own runner, building afresh inside
  # vinext-cloudflare. A failed app is retried by rerunning its job; the others
  # are left to finish rather than cut off halfway.
  deploy:
    name: 'Deploy ${{ matrix.app.id }}'
    needs: ['plan', 'build', 'verify-supabase']
    runs-on: 'ubuntu-latest'
    environment: 'production'
    strategy:
      fail-fast: false
      matrix:
        app: '${{ fromJSON(needs.plan.outputs.apps) }}'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'moonrepo/setup-toolchain@v0'
      # moon installs the Node and pnpm from .moon/toolchains.yaml but keeps
      # them off PATH; `moon bin` says where they are.
      - run: |
          moon setup
          dirname "$(moon bin node)" >> "$GITHUB_PATH"
          dirname "$(moon bin pnpm)" >> "$GITHUB_PATH"
      - run: 'pnpm install --frozen-lockfile'
      - run: 'pnpm --dir ${{ matrix.app.source }} run deploy:vinext'
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          NEXT_PUBLIC_ACCOUNT_URL: '${{ vars.NEXT_PUBLIC_ACCOUNT_URL }}'
          NEXT_PUBLIC_SUPABASE_URL: '${{ vars.NEXT_PUBLIC_SUPABASE_URL }}'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: '${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}'
          NEXT_PUBLIC_COOKIE_DOMAIN: '${{ vars.NEXT_PUBLIC_COOKIE_DOMAIN }}'

  # A release exists only for a version that is live.
  release:
    name: 'Release'
    needs: 'deploy'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
    steps:
      - run: 'gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes'
        env:
          GH_TOKEN: '${{ github.token }}'
