name: 'CI'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# Checks read the code and nothing else.
permissions:
  contents: 'read'

jobs:
  ci:
    name: 'CI'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
        with:
          # `moon ci` diffs against the base branch, so it needs full history.
          fetch-depth: 0
          filter: 'blob:none'

      # Installs moon only; moon then installs Node, pnpm and dependencies
      # from .moon/toolchains.yaml.
      - uses: 'moonrepo/setup-toolchain@v0'

      # About six thousand sprites, fetched one by one, take minutes. The key is
      # the manifest itself, with no fallback to an older one, and the fetch
      # still checks every hash and deletes what the manifest does not list.
      # A run that never builds pokedex-web has no sprites and saves nothing.
      # Caches saved here, on main, are the ones CD restores.
      - uses: 'actions/cache@v6'
        with:
          path: 'apps/pokedex-web/public/sprites'
          key: "pokedex-sprites-${{ hashFiles('apps/pokedex-web/sprites.json') }}"

      # Builds here only check the code, so they run without production
      # NEXT_PUBLIC_* values. A deploy workflow must never set this.
      #
      # pokedex-web's build reads the local database that `supabase:verify`
      # starts, at the fixed local-development URL and key.
      - run: 'moon ci'
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH'
