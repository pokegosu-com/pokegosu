name: 'CI'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  ci:
    name: 'CI'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
        with:
          # `moon ci` diffs against the base branch, so it needs full history.
          fetch-depth: 0
          filter: 'blob:none'

      # Installs moon only; moon then installs Node, pnpm and dependencies
      # from .moon/toolchains.yaml.
      - uses: 'moonrepo/setup-toolchain@v0'

      - run: 'moon ci'
